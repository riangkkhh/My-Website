const vis=new IntersectionObserver(es=>es.forEach(e=>{e.target._f.vis=e.isIntersecting}),{rootMargin:'100px'});
function setupPrints(){
vis.disconnect();fps=[];
document.querySelectorAll('.stage,.cfp').forEach(st=>{
const S=Math.round(st.clientWidth)||340,dpr=Math.min(2,devicePixelRatio||1),font=Math.max(9,Math.round(S/50));
const cv=st.querySelector('.fp');cv.width=cv.height=S*dpr;
const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
const d=st.dataset,m=makePrint(S,+d.seed,+d.kind,font),f={cv,c,S,h:+d.h,font,pts:m.pts,runs:m.runs,vis:false};
st._f=f;fps.push(f);vis.observe(st);
if(calm)drawFp(f)})}

function drawFp(f){
const{c,S,pts,runs,h,font}=f,rc=f.cv.getBoundingClientRect(),k=S/(rc.width||S);
const lx=(mx-rc.left)*k,ly=(my-rc.top)*k,R=S*.2;
c.clearRect(0,0,S,S);
c.lineWidth=1;c.strokeStyle=light?'rgba(20,16,43,.14)':'rgba(239,234,255,.12)';
c.beginPath();
for(const run of runs){c.moveTo(run[0][0],run[0][1]);for(let i=1;i<run.length;i++)c.lineTo(run[i][0],run[i][1])}
c.stroke();
c.textAlign='center';c.textBaseline='middle';
let big=false;c.font=font+'px '+mono;
for(const p of pts){
const dh=Math.hypot(lx-p.hx,ly-p.hy),near=live&&!calm&&dh<R;
const tx=near?lx+p.ox:p.hx,ty=near?ly+p.oy:p.hy,sp=near?.16:.07;
p.vx=(p.vx+(tx-p.x)*sp)*.78;p.vy=(p.vy+(ty-p.y)*sp)*.78;
p.x+=p.vx;p.y+=p.vy;
p.heat=Math.max(p.heat*.985,near?.45+(1-dh/R)*.55:0);
if(near&&Math.random()<.05)p.c=glyphs[Math.random()*glyphs.length|0];
const b=p.heat>.55;
if(b!==big){big=b;c.font=(b?font+4:font)+'px '+mono}
const hh=(h+p.heat*75)%360,al=Math.min(1,p.a+p.heat*.5);
c.fillStyle=light?`hsla(${hh},${65+p.heat*25}%,${34-p.heat*8}%,${al})`:`hsla(${hh},${55+p.heat*35}%,${72+p.heat*12}%,${al})`;
c.fillText(p.c,p.x,p.y)}}

function render(){
const L=lang==='he'?'he-IL':'en-GB',fe=document.getElementById('feed');
const ps=[...posts].sort((a,b)=>b.date.localeCompare(a.date));
const asc=[...posts].sort((a,b)=>a.date.localeCompare(b.date));
fe.innerHTML=ps.length?ps.map(p=>{const au=esc(p.author||'MONT BLANC'),ini=au.split(' ').map(w=>w[0]).join('').slice(0,2),n=asc.indexOf(p)+1;return`<article class="msg rv${seen?' in':''}"><div class="au"><div class="av">${ini}</div><div class="an">${au}</div><div class="rl">${T[lang].adm}</div></div><div class="pb"><div class="ph"><span class="mt">${esc(p.topic)}</span><span><time datetime="${p.date}">${new Date(p.date+'T12:00:00').toLocaleDateString(L,{day:'numeric',month:'long',year:'numeric'})}</time> · <span class="pn">#${n}</span></span></div><div class="pt"><h2>${esc(p.title)}</h2>${p.body.map(x=>`<p>${esc(x)}</p>`).join('')}</div></div></article>`}).join(''):`<p class="none">${T[lang].none}</p>`;
document.getElementById('pj').innerHTML=items.map(p=>`<a class="cd r mini" href="${p.u}" target="_blank" rel="noopener" style="--cc:hsl(${p.h},90%,62%);--cg:hsla(${p.h},90%,60%,.16);--glow:${p.glow};--px:15%"><div class="cfp" data-h="${p.h}" data-seed="${p.seed}" data-kind="${p.kind}"><canvas class="fp" role="img" aria-label="Digital fingerprint"></canvas></div><div class="ct">${p.t[lang]}</div><svg class="ar" viewBox="0 0 100 60"><path d="M6 30H92M68 8l24 22-24 22"/></svg></a>`).join('');
document.querySelectorAll('.rv:not(.in)').forEach(x=>io.observe(x));
setupPrints()}

const abcs={he:'אבגדהוזחטיכלמנסעפצקרשת',en:'abcdefghijklmnopqrstuvwxyz'};
function scramble(el){const fin=el.dataset.f=el.textContent;const set=abcs[lang];let n=0;clearInterval(el._i);el._i=setInterval(()=>{el.textContent=[...fin].map((c,k)=>c===' '||c===':'||k<n?c:set[Math.random()*set.length|0]).join('');n+=.5;if(n>fin.length){el.textContent=fin;clearInterval(el._i)}},28)}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');seen=true;const h=e.target.querySelector('[data-s]');if(h)scramble(h);io.unobserve(e.target)}}),{threshold:.35});

function setLang(l){
lang=l;ls.set('mb-lang',l);
const d=document.documentElement;d.lang=l;d.dir=l==='he'?'rtl':'ltr';
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[l][e.dataset.i]);
document.getElementById('lg').textContent=T[l].btn;
render()}

function setTheme(t){
document.documentElement.dataset.theme=t;ls.set('mb-theme',t);
light=t==='light';
const f=getComputedStyle(document.documentElement).getPropertyValue('--fade').trim().split(',').map(Number);
fade=f.length===3?f:fade;
if(typeof calm!=='undefined'&&calm){ctx.fillStyle=`rgb(${fade})`;ctx.fillRect(0,0,W,H);fps.forEach(drawFp)}}

const nm=document.getElementById('name'),letters=[];
const words=nm.textContent.split(' ');nm.textContent='';
words.forEach(w=>{const s=document.createElement('span');s.className='w';s.setAttribute('aria-hidden','true');[...w].forEach(ch=>{const c=document.createElement('span');c.className='c';c.textContent=ch;s.appendChild(c);letters.push(c)});nm.appendChild(s)});

let mx=-999,my=-999,live=false,fxBusy=false;
addEventListener('pointermove',e=>{
mx=e.clientX;my=e.clientY;live=true;
if(!fxBusy)letters.forEach(c=>{const r=c.getBoundingClientRect(),dx=r.left+r.width/2-mx,dy=r.top+r.height/2-my,d=Math.hypot(dx,dy)||1;
if(d<220){const f=(220-d)/220;c.style.transform=`translate(${dx/d*f*80}px,${dy/d*f*80}px) rotate(${f*(dx>0?1:-1)*40}deg)`;c.style.color='var(--ember)'}else{c.style.transform='';c.style.color=''}})});
document.addEventListener('pointerleave',()=>{live=false});

const mail=document.getElementById('mail');
mail.addEventListener('pointermove',e=>{const r=mail.getBoundingClientRect();mail.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.06}px,${(e.clientY-r.top-r.height/2)*.12}px)`});
mail.addEventListener('pointerleave',()=>mail.style.transform='');

const cv=document.getElementById('sky'),ctx=cv.getContext('2d'),bar=document.getElementById('bar');
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const hues=[18,255,195,260];
let W,H,P=[],sv=0,ly=scrollY,rt;
const wc=document.getElementById('web'),wx=wc.getContext('2d');
let nodes=[],edges=[],dh0=0,fc=0;
function buildWeb(){
const dh=document.documentElement.scrollHeight,r=rng(91),cnt=Math.floor(W*dh/52000),min=Math.max(90,W*.09);
dh0=dh;nodes=[];let tries=0;
while(nodes.length<cnt&&tries<cnt*30){tries++;const x=r()*W,y=r()*dh;if(nodes.every(n=>Math.hypot(n.x-x,n.y-y)>min))nodes.push({x,y})}
nodes.sort((a,b)=>a.y-b.y);edges=[];
nodes.forEach((a,i)=>{nodes.slice(i+1,i+40).filter(b=>Math.hypot(b.x-a.x,b.y-a.y)<min*3.2).sort((p,q)=>Math.hypot(p.x-a.x,p.y-a.y)-Math.hypot(q.x-a.x,q.y-a.y)).slice(0,2).forEach(b=>edges.push({a,b,h:hues[r()*3|0]}))})}
function drawWeb(){
wx.clearRect(0,0,W,H);
const sy=scrollY,lim=sy+H*.8;
wx.lineWidth=1;
for(const e of edges){
const a=e.a,b=e.b;
if(a.y-sy>H+60||b.y-sy<-60)continue;
const t=Math.max(0,Math.min(1,(lim-a.y)/(Math.abs(b.y-a.y)+160)));
if(t<=0)continue;
const p=t*t*(3-2*t),x1=a.x,y1=a.y-sy,x2=a.x+(b.x-a.x)*p,y2=y1+(b.y-a.y)*p;
const col=light?`hsla(${e.h},75%,42%,`:`hsla(${e.h},85%,68%,`;
wx.strokeStyle=col+'.32)';
wx.beginPath();wx.moveTo(x1,y1);wx.lineTo(x2,y2);wx.stroke();
wx.fillStyle=col+'.7)';
wx.beginPath();wx.arc(x1,y1,2.2,0,7);wx.fill();
if(p<1){wx.fillStyle=col+'1)';wx.beginPath();wx.arc(x2,y2,2.8,0,7);wx.fill()}}}
function init(){W=cv.width=wc.width=innerWidth;H=cv.height=wc.height=innerHeight;buildWeb();
const n=0;
P=Array.from({length:n},()=>{const x=Math.random()*W,y=Math.random()*H;return{x,y,px:x,py:y,vx:0,vy:0,hx:x,hy:y,h:hues[Math.random()*4|0],s:Math.random()<.35?90:25}})}
addEventListener('resize',()=>{init();clearTimeout(rt);rt=setTimeout(setupPrints,200)});init();
const upd=()=>{ly=scrollY;bar.style.transform=`scaleY(${Math.min(1,scrollY/((document.documentElement.scrollHeight-innerHeight)||1))})`};
addEventListener('scroll',()=>{sv+=(scrollY-ly)*.12;upd();if(calm)drawWeb()},{passive:true});
function tick(){
drawWeb();if(++fc%60===0&&Math.abs(document.documentElement.scrollHeight-dh0)>30)buildWeb();
ctx.fillStyle=`rgba(${fade},.22)`;ctx.fillRect(0,0,W,H);
sv*=.92;
const cx=live?mx:W/2,cy=live?my:H/2;
for(const p of P){
p.px=p.x;p.py=p.y;
const dx=cx-p.x,dy=cy-p.y,q=dx*dx+dy*dy+400,d=Math.sqrt(q),g=9000/q;
p.vx+=dx/d*g*1.6-dy/d*g*1.1;
p.vy+=dy/d*g*1.6+dx/d*g*1.1;
p.vx+=(p.hx-p.x)*.0012;p.vy+=(p.hy-p.y)*.0012;
p.vy-=sv*.35;
p.vx*=.955;p.vy*=.955;
p.x+=p.vx;p.y+=p.vy;
if(p.y<-20){p.y=H+10;p.py=p.y}if(p.y>H+20){p.y=-10;p.py=p.y}
const sp=Math.min(1,Math.hypot(p.vx,p.vy)/6);
ctx.strokeStyle=light?`hsla(${p.h},${60+p.s/3}%,${40-sp*8}%,${.35+sp*.65})`:`hsla(${p.h},${p.s+sp*10}%,${62+sp*28}%,${.3+sp*.7})`;
ctx.lineWidth=.6+sp*1.5;
ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x+p.vx*.5,p.y+p.vy*.5);ctx.stroke()}
for(const f of fps)if(f.vis)drawFp(f);
requestAnimationFrame(tick)}

document.querySelectorAll('.cd').forEach(a=>a.addEventListener('click',e=>{if(a.getAttribute('href')==='#')e.preventDefault()}));
const fxb=document.getElementById('fxb'),fxp=document.getElementById('fxp'),gr=document.getElementById('gr'),fl=document.getElementById('fl');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ink=()=>getComputedStyle(document.getElementById('name')).color;
const reset=()=>letters.forEach(c=>{c.style.transform='';c.style.color=''});
function toTop(){return new Promise(r=>{if(scrollY<4)return r();window.scrollTo({top:0,behavior:'smooth'});const t=performance.now();(function w(){scrollY<4||performance.now()-t>1800?r():requestAnimationFrame(w)})()})}
function shake(amp,ms){const k=[];for(let i=0;i<=18;i++){const d=1-i/18,q=()=>(Math.random()-.5)*2*amp*d;k.push({transform:i===18?'none':`translate(${q()}px,${q()}px) rotate(${q()*.08}deg)`})}document.querySelector('main').animate(k,{duration:ms,easing:'linear'})}
async function shatter(){
const H=innerHeight,col=ink(),halves=[];
fl.animate([{opacity:0},{opacity:.75},{opacity:0}],{duration:300});
shake(16,800);
const jag=['polygon(0 0,62% 0,48% 35%,58% 60%,40% 100%,0 100%)','polygon(62% 0,100% 0,100% 100%,40% 100%,58% 60%,48% 35%)'];
letters.forEach(c=>{
const t=c.textContent,dl=Math.random()*240;
c.style.position='relative';c.style.color='transparent';
jag.forEach((cl,k)=>{
const h=document.createElement('span');h.textContent=t;h.setAttribute('aria-hidden','true');
h.style.cssText=`position:absolute;inset:0;color:${col};clip-path:${cl};pointer-events:none`;
c.appendChild(h);halves.push(h);
const dir=k?1:-1,dx=dir*(25+Math.random()*70),rot=dir*(25+Math.random()*60);
h.animate([
{transform:'none',offset:0},
{transform:`translate(${dir*2}px,-1px) rotate(${dir}deg)`,offset:.05},
{transform:`translate(${-dir*2}px,1px) rotate(${-dir}deg)`,offset:.1},
{transform:'none',offset:.16,easing:'cubic-bezier(.55,0,1,.6)'},
{transform:`translate(${dx}px,${H*1.15}px) rotate(${rot*3}deg)`,offset:.55},
{transform:`translate(${dx}px,${H*1.15}px) rotate(${rot*3}deg)`,offset:.7,easing:'cubic-bezier(.2,.9,.3,1.1)'},
{transform:'none',offset:1}],{duration:2700,delay:dl})})});
setTimeout(()=>shake(22,700),1450);
await sleep(3050);
halves.forEach(h=>h.remove());
letters.forEach(c=>{c.style.position='';c.style.color=''})}
async function flip(){
const base=ink(),cols=[base,'#ff5a1f','#5ee6ff','#7b6cff','#ff2e63','#ffc63d','#6bff8a',base],L=cols.length-1;
letters.forEach((c,i)=>{c.animate(cols.map((col,k)=>({color:col,transform:`perspective(500px) rotateY(${k*360*(i%2?-1:1)}deg) scale(${k%2&&k<L?1.18:1})`})),{duration:1500,delay:i*55,easing:'cubic-bezier(.4,0,.2,1)'})});
await sleep(1500+letters.length*55+80)}
const teeth=(a0,a1,n)=>{let d='';for(let i=0;i<n;i++){const a=(a0+(a1-a0)*(i+.5)/n)*Math.PI/180,w=(a1-a0)/n*.46*Math.PI/180,p=(g,r)=>(200+Math.cos(g)*r).toFixed(1)+','+(200+Math.sin(g)*r).toFixed(1),len=36+(i%2?14:0)+(Math.abs(i-n/2+.5)<1.6?18:0);d+=`<polygon points="${p(a-w,124)} ${p(a+w,124)} ${p(a,124-len)}"/>`}return d};
async function panic(){
const o=letters.find(c=>c.textContent==='O')||letters[1],r=o.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,size=Math.max(vw,vh)*1.25,base=ink();
const sx=r.left+r.width/2-vw/2,sy=r.top+r.height/2-vh/2,s0=Math.max(r.width,r.height)/size;
const w=document.createElement('div');w.className='bigO';
w.style.cssText=`width:${size}px;height:${size}px;left:${(vw-size)/2}px;top:${(vh-size)/2}px`;
w.innerHTML=`<svg viewBox="0 0 400 400" width="100%" height="100%"><circle class="mo" cx="200" cy="200" r="122" fill="#0a0305" opacity="0" style="transform-origin:200px 200px"/><g class="tu" fill="#fff" stroke="#d8d0d8" stroke-width="1.5" opacity="0">${teeth(205,335,9)}</g><g class="tb" fill="#fff" stroke="#d8d0d8" stroke-width="1.5" opacity="0">${teeth(25,155,9)}</g><circle class="rim" cx="200" cy="200" r="157" fill="none" stroke="${base}" stroke-width="72"/></svg>`;
document.body.appendChild(w);
o.style.visibility='hidden';
const q=c=>w.querySelector(c),tr=`translate(${sx}px,${sy}px) scale(${s0})`;
await w.animate([{transform:tr},{transform:'translate(0,0) scale(1)'}],{duration:170,easing:'cubic-bezier(.95,0,1,.45)',fill:'forwards'}).finished;
fl.animate([{opacity:0},{opacity:.9},{opacity:0}],{duration:280});
gr.animate([{opacity:0},{opacity:1}],{duration:200,fill:'forwards'});
shake(44,1600);
q('.rim').animate([{stroke:base},{stroke:'#ff2a1a'}],{duration:300,fill:'forwards'});
q('.mo').animate([{opacity:0,transform:'scale(.1)'},{opacity:1,transform:'scale(1)'}],{duration:300,fill:'forwards'});
const chomp=y=>[{opacity:0,transform:`translateY(${y*2}px)`},{opacity:1,transform:'translateY(0)',offset:.25},{opacity:1,transform:`translateY(${y}px)`,offset:.45},{opacity:1,transform:'translateY(0)',offset:.6},{opacity:1,transform:`translateY(${y}px)`,offset:.8},{opacity:1,transform:'translateY(0)'}];
q('.tu').animate(chomp(-22),{duration:1500,delay:150,fill:'forwards'});
q('.tb').animate(chomp(22),{duration:1500,delay:150,fill:'forwards'});
w.animate([{transform:'scale(1)'},{transform:'scale(1.14) rotate(-2deg)'},{transform:'scale(.97) rotate(2deg)'},{transform:'scale(1.1) rotate(-1deg)'},{transform:'scale(1)'}],{duration:1500,delay:100});
await sleep(1750);
gr.getAnimations().forEach(a=>a.cancel());
gr.animate([{opacity:1},{opacity:0}],{duration:450});
['.mo','.tu','.tb'].forEach(c=>q(c).animate([{opacity:1},{opacity:0}],{duration:250,fill:'forwards'}));
q('.rim').animate([{stroke:'#ff2a1a'},{stroke:base}],{duration:300,fill:'forwards'});
await w.animate([{transform:'translate(0,0) scale(1)'},{transform:tr}],{duration:380,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).finished;
w.remove();o.style.visibility=''}
async function runFx(n){
if(fxBusy)return;
fxBusy=true;fxp.classList.remove('open');fxb.disabled=true;
try{await toTop();reset();await sleep(80);await({shatter,flip,panic}[n])()}finally{fxBusy=false;fxb.disabled=false;reset()}}
fxb.addEventListener('click',()=>{fxp.classList.toggle('open');toTop()});
fxp.querySelectorAll('[data-fx]').forEach(b=>b.addEventListener('click',()=>runFx(b.dataset.fx)));
document.addEventListener('click',e=>{if(!e.target.closest('.fxp,#fxb'))fxp.classList.remove('open')});
document.getElementById('tl').onclick=()=>setTheme(light?'dark':'light');
document.getElementById('lg').onclick=()=>setLang(lang==='he'?'en':'he');
setTheme(ls.get('mb-theme')||'dark');
setLang(ls.get('mb-lang')||'he');

addEventListener('load',buildWeb);
if(calm){ctx.fillStyle=`rgb(${fade})`;ctx.fillRect(0,0,W,H);buildWeb();drawWeb()}else tick();
upd();
</script>
</body>
